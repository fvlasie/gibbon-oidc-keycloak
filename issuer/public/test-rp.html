<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gibbon OIDC test client</title>
  <style>
    :root { font-family: Georgia, serif; color: #1c1917; background: #f5f1ea; }
    body { max-width: 40rem; margin: 2.5rem auto; padding: 0 1.25rem; }
    button { font: inherit; padding: 0.45rem 0.9rem; background: #1e3a5f; color: #fff; border: 0; cursor: pointer; }
    pre { background: #1c1917; color: #f5f1ea; padding: 1rem; overflow: auto; font-size: 0.8rem; }
    .muted { color: #57534e; }
  </style>
</head>
<body>
  <h1>Test relying party</h1>
  <p class="muted">Authorization code + PKCE against <code id="iss">__ISSUER__</code></p>
  <p>
    <button id="login">Sign in with Gibbon</button>
    <button id="userinfo" hidden>Call userinfo</button>
    <button id="logout" hidden>Sign out</button>
  </p>
  <p id="status">Not signed in.</p>
  <pre id="out"></pre>
  <script>
    const issuer = document.getElementById('iss').textContent.trim();
    const clientId = 'test-rp';
    const redirectUri = location.origin + location.pathname;
    const out = document.getElementById('out');
    const status = document.getElementById('status');

    function b64url(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    async function sha256(str) {
      const data = new TextEncoder().encode(str);
      return crypto.subtle.digest('SHA-256', data);
    }
    function randomString() {
      const a = new Uint8Array(32);
      crypto.getRandomValues(a);
      return b64url(a);
    }

    async function startLogin() {
      const verifier = randomString();
      const challenge = b64url(await sha256(verifier));
      const state = randomString();
      sessionStorage.setItem('pkce', JSON.stringify({ verifier, state }));
      const u = new URL(issuer + '/protocol/openid-connect/auth');
      u.searchParams.set('client_id', clientId);
      u.searchParams.set('redirect_uri', redirectUri);
      u.searchParams.set('response_type', 'code');
      u.searchParams.set('scope', 'openid profile email offline_access roles');
      u.searchParams.set('state', state);
      u.searchParams.set('code_challenge', challenge);
      u.searchParams.set('code_challenge_method', 'S256');
      location.href = u.toString();
    }

    async function finishLogin() {
      const q = new URLSearchParams(location.search);
      if (!q.get('code')) return;
      const saved = JSON.parse(sessionStorage.getItem('pkce') || '{}');
      if (q.get('state') !== saved.state) {
        status.textContent = 'State mismatch.';
        return;
      }
      const body = new URLSearchParams({
        grant_type: 'authorization_code',
        code: q.get('code'),
        redirect_uri: redirectUri,
        client_id: clientId,
        code_verifier: saved.verifier,
      });
      const res = await fetch(issuer + '/protocol/openid-connect/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });
      const tokens = await res.json();
      sessionStorage.setItem('tokens', JSON.stringify(tokens));
      history.replaceState({}, '', location.pathname);
      render(tokens);
    }

    async function callUserinfo() {
      const tokens = JSON.parse(sessionStorage.getItem('tokens') || '{}');
      const res = await fetch(issuer + '/protocol/openid-connect/userinfo', {
        headers: { Authorization: 'Bearer ' + tokens.access_token },
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }

    function signOut() {
      const tokens = JSON.parse(sessionStorage.getItem('tokens') || '{}');
      sessionStorage.removeItem('tokens');
      const u = new URL(issuer + '/protocol/openid-connect/logout');
      u.searchParams.set('post_logout_redirect_uri', redirectUri);
      location.href = u.toString();
    }

    function decodeJwt(t) {
      try {
        const p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(p.padEnd(p.length + (4 - p.length % 4) % 4, '=')));
      } catch { return {}; }
    }

    function render(tokens) {
      if (!tokens.access_token) {
        status.textContent = 'Not signed in.';
        return;
      }
      document.getElementById('userinfo').hidden = false;
      document.getElementById('logout').hidden = false;
      const claims = decodeJwt(tokens.access_token);
      status.textContent = 'Signed in as ' + (claims.preferred_username || claims.sub);
      out.textContent = JSON.stringify({ tokens: { ...tokens, access_claims: claims }, }, null, 2);
    }

    document.getElementById('login').onclick = startLogin;
    document.getElementById('userinfo').onclick = callUserinfo;
    document.getElementById('logout').onclick = signOut;
    finishLogin().then(() => {
      const existing = JSON.parse(sessionStorage.getItem('tokens') || 'null');
      if (existing) render(existing);
    });
  </script>
</body>
</html>
