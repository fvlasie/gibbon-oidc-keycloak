# Proxy Keycloak-shaped paths to the Gibbon module issuer.
# Place this on the same server_name as Gibbon.

location /realms/ {
    rewrite ^ /modules/OIDC%20Server/issuer/index.php last;
}

location = /modules/OIDC Server/issuer/index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/modules/OIDC Server/issuer/index.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}
