# Keycloak-shaped issuer paths → Gibbon module
#
# VirtualHost context: the pattern includes the leading slash.
# .htaccess / <Directory> context: omit the leading slash on the pattern.

# --- Inside <VirtualHost> when DocumentRoot is /var/www/html
#     and Gibbon is served at https://host/c/ ---
RewriteEngine On
RewriteRule ^/realms/ /c/modules/OIDC\ Server/issuer/index.php [PT,L,QSA,E=OIDC_REQUEST_URI:%{REQUEST_URI}]

# --- Inside <VirtualHost> when DocumentRoot is /var/www/html/c ---
# RewriteRule ^/realms/ /modules/OIDC\ Server/issuer/index.php [PT,L,QSA,E=OIDC_REQUEST_URI:%{REQUEST_URI}]
